AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CMX - one-time setup that lets GitHub Actions deploy the app into this account and region:
  GitHub OIDC sign-in (no stored keys), the image repository, the role CloudFormation uses for the app stacks
  (cmms-app here, cmms-edge in us-east-1, cmms-dr in eu-west-1), the guard that keeps backups out of the pipeline's reach,
  and the permissions boundary every app role carries. Deploy with deploy/aws/setup.sh (see docs/DEPLOY_AWS.md).

Parameters:
  GitHubRepo:
    Type: String
    Default: MoXFahmy/CMMSX
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: owner/name of the GitHub repository allowed to deploy (from its main branch only).
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      false when this AWS account already has the token.actions.githubusercontent.com identity provider
      (an account can have only one).
  AppStackName:
    Type: String
    Default: cmms-app
    Description: Name of the CloudFormation stack that holds the app.
  GitHubOwnerId:
    Type: String
    Default: ""
    AllowedPattern: "^[0-9]*$"
    Description: >-
      Numeric id of the repository owner. GitHub now puts immutable ids in the OIDC subject
      (repo:owner@ownerId/name@repoId:...); setup.sh looks both ids up. Empty = accept only the name-only subject.
  GitHubRepoId:
    Type: String
    Default: ""
    AllowedPattern: "^[0-9]*$"
    Description: Numeric id of the repository (see GitHubOwnerId).
  CreateTrail:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      false when the account already has a multi-region CloudTrail trail that is logging (setup.sh checks); a second
      trail of the same events would cost $2 per 100,000 events.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]
  CreateTheTrail: !Equals [!Ref CreateTrail, "true"]
  HasRepoIds: !And
    - !Not [!Equals [!Ref GitHubOwnerId, ""]]
    - !Not [!Equals [!Ref GitHubRepoId, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cmms
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 30 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},
            "action":{"type":"expire"}}]}

  # CloudFormation takes templates over 51,200 bytes only from S3: the workflow deploys with --s3-bucket <this bucket>.
  TemplateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cmms-templates-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-templates
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  TemplateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TemplateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TemplateBucket.Arn
              - !Sub "${TemplateBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # Who did what in the account: management events from every region, kept in a bucket the pipeline can't change.
  # It lives here (deployed by the account administrator with setup.sh), never in a stack the pipeline deploys.
  TrailBucket:
    Type: AWS::S3::Bucket
    Condition: CreateTheTrail
    # The logs outlive the stack; a setup run that fails while creating the bucket removes it again, so the
    # next run can create it (Retain would keep it and make every re-run fail on the taken name).
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "cmms-trail-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: { Mode: GOVERNANCE, Days: 90 }
      LifecycleConfiguration:
        Rules:
          # Expiry at 365 days leaves a delete marker (versioned bucket); the old version goes the day after.
          - Id: archive-then-expire
            Status: Enabled
            Transitions: [{ StorageClass: GLACIER_IR, TransitionInDays: 90 }]
            ExpirationInDays: 365
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateTheTrail
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TrailBucket.Arn
              - !Sub "${TrailBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/cmms-trail"
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/cmms-trail"

  Trail:
    Type: AWS::CloudTrail::Trail
    Condition: CreateTheTrail
    DependsOn: TrailBucketPolicy # CloudTrail checks the bucket policy when the trail is created
    Properties:
      TrailName: cmms-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      # No EventSelectors: management events (read and write) only, the trail's default.

  # The backups must survive a compromised deploy pipeline (GitHub is on the internet). Two places hold the same explicit
  # denies, so keep their "Keep..." statements in step: backup-guard on CloudFormationExecutionRole (the pipeline itself)
  # and this boundary (every role the pipeline creates). Destructive actions only: creating the vault with its lock, the
  # Ireland buckets with Object Lock, replication and the London vault's access policy stays allowed. In Ireland those
  # settings can't shorten what is already stored (Object Lock retention and a locked vault's recovery points outlive
  # them). The CloudTrail trail and its bucket are in this stack, so the pipeline may change neither.
  # The vault lock and Object Lock are governance mode: the account's own console administrator (root or an IAM
  # administrator outside the pipeline) can still lift them. Names are fixed by the recovery stack (cmms-dr, eu-west-1).
  #
  # As a permissions boundary it allows everything else, so an app role keeps exactly what its own policies grant, minus
  # these denies. It also stops a role inside it from changing IAM or passing or assuming a role outside /cmms/: without
  # that, a role given iam:* could create a role without the boundary, or strip backup-guard off the pipeline.
  PermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # Region in the name like the roles below: IAM names are account-wide, and a rebuild runs this setup in a new region.
      ManagedPolicyName: !Sub "cmms-boundary-${AWS::Region}"
      Path: /cmms/
      Description: CMX app roles - everything except deleting backups, the Ireland copies, the CloudTrail logs, or changing IAM.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowInsideTheBoundary
            Effect: Allow
            Action: "*"
            Resource: "*"
          # Recovery point ARNs depend on the backed-up service (rds:...:snapshot:awsbackup:..., backup:...:recovery-point:...),
          # so this covers all of them. Nothing in the stacks deletes or re-dates a recovery point.
          - Sid: KeepRecoveryPoints
            Effect: Deny
            Action:
              - backup:DeleteRecoveryPoint
              - backup:UpdateRecoveryPointLifecycle
            Resource: "*"
          - Sid: KeepTheIrelandVault
            Effect: Deny
            Action:
              - backup:DeleteBackupVault
              - backup:DeleteBackupVaultAccessPolicy
              - backup:DeleteBackupVaultLockConfiguration
            Resource: !Sub "arn:${AWS::Partition}:backup:eu-west-1:${AWS::AccountId}:backup-vault:cmms-dr-vault"
          # The database's automated backups replicated to Ireland (London's own stay with the app stack's settings).
          # Stopping the replication isn't denied: the copies already made stay for their retention period, and
          # CloudFormation stops it to undo a failed deploy that turned it on (denied, cmms-app would be stuck in
          # UPDATE_ROLLBACK_FAILED).
          - Sid: KeepTheIrelandDatabaseBackups
            Effect: Deny
            Action: rds:DeleteDBInstanceAutomatedBackup
            Resource: !Sub "arn:${AWS::Partition}:rds:eu-west-1:${AWS::AccountId}:auto-backup:*"
          # The Ireland vault and the replicated backups are encrypted with a key in Ireland; deleting or disabling it would
          # make every copy unreadable (not even deleting the cmms-dr stack can schedule its deletion).
          - Sid: KeepTheIrelandKeys
            Effect: Deny
            Action:
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
            Resource: !Sub "arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*"
          # A key policy that skips KMS's lockout check can shut the account out of its own key.
          - Sid: KeepTheIrelandKeysManageable
            Effect: Deny
            Action: kms:PutKeyPolicy
            Resource: !Sub "arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*"
            Condition:
              Bool: { "kms:BypassPolicyLockoutSafetyCheck": "true" }
          - Sid: KeepNewKeysManageable
            Effect: Deny
            Action: kms:CreateKey # no resource-level permissions: "*" only
            Resource: "*"
            Condition:
              Bool: { "kms:BypassPolicyLockoutSafetyCheck": "true" }
          # The trail and its bucket belong to this setup stack, never the pipeline, so nothing the pipeline deploys needs
          # these. Every trail in the account: cmms-trail, or the account's own multi-region trail setup.sh found instead.
          - Sid: KeepTheTrail
            Effect: Deny
            Action:
              - cloudtrail:UpdateTrail
              - cloudtrail:DeleteTrail
              - cloudtrail:StopLogging
              - cloudtrail:PutEventSelectors
              - cloudtrail:PutInsightSelectors
            Resource: !Sub "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*"
          # Object Lock retention can't be cut short anywhere.
          - Sid: KeepLockedVersions
            Effect: Deny
            Action: s3:BypassGovernanceRetention
            Resource: "*"
          # An access point would reach the buckets below through ARNs these denies don't name. No stack uses one.
          - Sid: KeepAccessPointsOut
            Effect: Deny
            Action:
              - s3:CreateAccessPoint
              - s3:CreateAccessPointForObjectLambda
              - s3:CreateMultiRegionAccessPoint
            Resource: "*"
          # The Ireland copies (cmms-dr-files-<account>, cmms-dr-backups-<account>). Plain DeleteObject only adds a delete
          # marker on these versioned Object Lock buckets (and the bucket's own create handler uses it), so it stays allowed.
          - Sid: KeepObjectVersions
            Effect: Deny
            Action: s3:DeleteObjectVersion
            Resource: !Sub "arn:${AWS::Partition}:s3:::cmms-dr-*/*"
          # No access point may exist (KeepAccessPointsOut); in case one does, nothing is written or deleted through it.
          - Sid: KeepObjectsBehindAccessPoints
            Effect: Deny
            Action:
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub "arn:${AWS::Partition}:s3:*:${AWS::AccountId}:accesspoint/*/object/*"
          # The Ireland buckets never get a bucket policy (same-account replication needs none), so they can't be opened
          # to another account, whose principals these denies don't reach.
          - Sid: KeepTheIrelandBucketsClosed
            Effect: Deny
            Action:
              - s3:DeleteBucket
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
            Resource: !Sub "arn:${AWS::Partition}:s3:::cmms-dr-*"
          # The trail bucket (cmms-trail-<account>) is set up by this stack and written only by CloudTrail as its service
          # principal, which these denies don't reach. Nothing the pipeline deploys writes to it, so every write is denied:
          # overwriting or deleting a log (an overwritten log becomes a noncurrent version the lifecycle removes a day after
          # its lock ends), the policy, lifecycle, lock, encryption, requester pays, ownership, ACLs and replication.
          # The "*" in the ARN covers the bucket and its objects.
          - Sid: KeepTheTrailBucket
            Effect: Deny
            Action:
              - s3:Put*
              - s3:Replicate*
              - s3:Delete*
            Resource: !Sub "arn:${AWS::Partition}:s3:::cmms-trail-*"
          # Boundary only: a role inside it never writes IAM (service-linked roles, which only their service can use,
          # stay possible) and never passes or assumes a role outside /cmms/ (e.g. this pipeline's own roles).
          - Sid: NoIamChanges
            Effect: Deny
            Action:
              - iam:Accept* # delegation requests: temporary access for an outside party
              - iam:Add*
              - iam:Associate*
              - iam:Attach*
              - iam:Create*
              - iam:Delete*
              - iam:Detach*
              - iam:Put*
              - iam:Remove*
              - iam:Set*
              - iam:Update*
              - iam:Upload*
            NotResource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*"
          - Sid: OnlyAppRoles
            Effect: Deny
            Action:
              - iam:PassRole
              - sts:AssumeRole
            NotResource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cmms/*"

  # CloudFormation creates the app's resources with this role, in every region (IAM is global). It cannot change IAM
  # outside the /cmms/ path, every role it creates there carries PermissionsBoundary, and backup-guard keeps the backups.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cmms-cfn-exec-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"
      Policies:
        - PolicyName: app-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageAppRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cmms/*"
              # A role is created, or given a boundary, only with PermissionsBoundary (CloudFormation passes it in CreateRole).
              - Sid: CreateRolesInsideTheBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cmms/*"
                Condition:
                  StringEquals: { "iam:PermissionsBoundary": !Ref PermissionsBoundary }
              # Permissions and trust go only to roles that carry the boundary.
              - Sid: GrantInsideTheBoundary
                Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cmms/*"
                Condition:
                  StringEquals: { "iam:PermissionsBoundary": !Ref PermissionsBoundary }
              # The app stack's two roles made before the boundary existed (CloudFormation names them
              # <stack>-<logical id>-<suffix>; cmms.yml sets no RoleName) can also be changed while they have no boundary,
              # so the first app deploy after this setup can give them the boundary whatever order CloudFormation writes
              # a role's policies and boundary in. Once they carry it this is the same as GrantInsideTheBoundary.
              - Sid: GrantToTheRolesMadeBeforeTheBoundary
                Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cmms/${AppStackName}-TaskRole-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cmms/${AppStackName}-TaskExecutionRole-*"
                Condition:
                  StringEqualsIfExists: { "iam:PermissionsBoundary": !Ref PermissionsBoundary }
              - Sid: NoRoleOutsideTheBoundary
                Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                Resource: "*"
                Condition:
                  StringNotEquals: { "iam:PermissionsBoundary": !Ref PermissionsBoundary }
              - Sid: KeepTheBoundary
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: "*"
        # Same denies as PermissionsBoundary's "Keep..." statements (see there); keep the two in step.
        - PolicyName: backup-guard
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: KeepRecoveryPoints
                Effect: Deny
                Action:
                  - backup:DeleteRecoveryPoint
                  - backup:UpdateRecoveryPointLifecycle
                Resource: "*"
              - Sid: KeepTheIrelandVault
                Effect: Deny
                Action:
                  - backup:DeleteBackupVault
                  - backup:DeleteBackupVaultAccessPolicy
                  - backup:DeleteBackupVaultLockConfiguration
                Resource: !Sub "arn:${AWS::Partition}:backup:eu-west-1:${AWS::AccountId}:backup-vault:cmms-dr-vault"
              - Sid: KeepTheIrelandDatabaseBackups
                Effect: Deny
                Action: rds:DeleteDBInstanceAutomatedBackup
                Resource: !Sub "arn:${AWS::Partition}:rds:eu-west-1:${AWS::AccountId}:auto-backup:*"
              - Sid: KeepTheIrelandKeys
                Effect: Deny
                Action:
                  - kms:ScheduleKeyDeletion
                  - kms:DisableKey
                Resource: !Sub "arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*"
              - Sid: KeepTheIrelandKeysManageable
                Effect: Deny
                Action: kms:PutKeyPolicy
                Resource: !Sub "arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*"
                Condition:
                  Bool: { "kms:BypassPolicyLockoutSafetyCheck": "true" }
              - Sid: KeepNewKeysManageable
                Effect: Deny
                Action: kms:CreateKey # no resource-level permissions: "*" only
                Resource: "*"
                Condition:
                  Bool: { "kms:BypassPolicyLockoutSafetyCheck": "true" }
              - Sid: KeepTheTrail
                Effect: Deny
                Action:
                  - cloudtrail:UpdateTrail
                  - cloudtrail:DeleteTrail
                  - cloudtrail:StopLogging
                  - cloudtrail:PutEventSelectors
                  - cloudtrail:PutInsightSelectors
                Resource: !Sub "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*"
              - Sid: KeepLockedVersions
                Effect: Deny
                Action: s3:BypassGovernanceRetention
                Resource: "*"
              - Sid: KeepAccessPointsOut
                Effect: Deny
                Action:
                  - s3:CreateAccessPoint
                  - s3:CreateAccessPointForObjectLambda
                  - s3:CreateMultiRegionAccessPoint
                Resource: "*"
              - Sid: KeepObjectVersions
                Effect: Deny
                Action: s3:DeleteObjectVersion
                Resource: !Sub "arn:${AWS::Partition}:s3:::cmms-dr-*/*"
              - Sid: KeepObjectsBehindAccessPoints
                Effect: Deny
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub "arn:${AWS::Partition}:s3:*:${AWS::AccountId}:accesspoint/*/object/*"
              - Sid: KeepTheIrelandBucketsClosed
                Effect: Deny
                Action:
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                Resource: !Sub "arn:${AWS::Partition}:s3:::cmms-dr-*"
              - Sid: KeepTheTrailBucket
                Effect: Deny
                Action:
                  - s3:Put*
                  - s3:Replicate*
                  - s3:Delete*
                Resource: !Sub "arn:${AWS::Partition}:s3:::cmms-trail-*"

  # GitHub Actions (main branch of GitHubRepo only) assumes this role: push images, deploy the app stacks
  # (the app here, the edge stack in us-east-1 and the recovery stack in eu-west-1, all through CloudFormationExecutionRole).
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cmms-github-deploy-${AWS::Region}"
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Either subject format, main branch only; the id form is pinned to this exact owner and repository.
                token.actions.githubusercontent.com:sub: !If
                  - HasRepoIds
                  - - !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
                    - !Sub
                      - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepoId}:ref:refs/heads/main"
                      - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                        Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                  - cloudformation:DeleteStack
                  # A rollback the guard refuses (e.g. removing the boundary from a role) can be finished with
                  # --resources-to-skip; the skipped role simply keeps its boundary.
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/cmms-edge/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:eu-west-1:${AWS::AccountId}:stack/cmms-dr/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:eu-west-1:${AWS::AccountId}:changeSet/*"
              # aws cloudformation deploy --s3-bucket: HeadObject (skips an unchanged template; GetObject covers it) and
              # PutObject; CloudFormation then reads the template URL as this role. It never lists the bucket.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${TemplateBucket.Arn}/*"
              - Effect: Allow
                Action: cloudformation:DescribeStacks # read this stack's outputs (BoundaryPolicyArn, TemplateBucketName)
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: cloudformation.amazonaws.com }
              - Effect: Allow
                Action: ec2:DescribeManagedPrefixLists # to find the CloudFront origin-facing prefix list
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Value for the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  BoundaryPolicyArn:
    Description: Permissions boundary every role under /cmms/ must carry (app stack parameter BoundaryPolicyArn)
    Value: !Ref PermissionsBoundary
  TemplateBucketName:
    Description: Bucket for aws cloudformation deploy --s3-bucket (templates over 51,200 bytes)
    Value: !Ref TemplateBucket
  TrailBucketName:
    Condition: CreateTheTrail # absent when the account's own trail is used (CreateTrail=false)
    Description: Bucket holding the cmms-trail CloudTrail logs
    Value: !Ref TrailBucket
