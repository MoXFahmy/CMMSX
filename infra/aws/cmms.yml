AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  4C CMMS - web app + API on ECS Fargate behind an Application Load Balancer and CloudFront (HTTPS),
  RDS for SQL Server, S3 for attachments. Deployed by .github/workflows/deploy-aws.yml; see docs/DEPLOY_AWS.md.

Parameters:
  ImageUri:
    Type: String
    Description: Container image to run, e.g. 123456789012.dkr.ecr.me-central-1.amazonaws.com/cmms:<commit>
  OriginPrefixListId:
    Type: String
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: >-
      Managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region, so only CloudFront can reach
      the load balancer. The deployment workflow looks it up.
  AllowRegistration:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Let visitors create new organizations from the sign-in page.
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class for SQL Server Express (db.t3.micro, db.t3.small, ...). Changing it causes a short restart.
  VpcCidr:
    Type: String
    Default: 10.60.0.0/16
    Description: Address range of the new VPC created for the app (it is not connected to your other VPCs).

Resources:
  # ---------------------------------------------------------------- Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets: load balancer and the app task (it needs outbound internet for ECR, S3, logs and secrets).
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-1" }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-2" }]

  # Private subnets: the database only (no internet route).
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-1" }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-2" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref OriginPrefixListId
          Description: CloudFront origin-facing servers

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App port from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: Load balancer

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SQL Server from the app only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: App

  # ---------------------------------------------------------------- Database (RDS for SQL Server)
  # Removed with the stack; a restored database snapshot can be given a new password in the RDS console.
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub "4C CMMS database login (${AWS::StackName})"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"cmmsadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} database subnets"
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: sqlserver-ex
      LicenseModel: license-included
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true

  # ---------------------------------------------------------------- Attachments (S3)
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      # Deleted or replaced files stay recoverable for 14 days.
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 14 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt FilesBucket.Arn, !Sub "${FilesBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------------------------------------------------------------- App (ECS Fargate)
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]

  # Used by ECS to pull the image, write logs and read the database login.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /cmms/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: read-database-login
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret

  # Used by the app itself: attachments in its own bucket only.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /cmms/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: attachments
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${FilesBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket # lets a missing file read as "not found" rather than "access denied"
                Resource: !GetAtt FilesBucket.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: cmms
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - { Name: ASPNETCORE_ENVIRONMENT, Value: Production }
            # TLS ends at CloudFront, which reports the original scheme in CloudFront-Forwarded-Proto.
            - { Name: ASPNETCORE_FORWARDEDHEADERS_ENABLED, Value: "true" }
            - { Name: ForwardedHeaders__ProtoHeaderName, Value: CloudFront-Forwarded-Proto }
            # Traffic to the database stays inside the VPC; the RDS certificate is not in the container's trust store.
            - Name: ConnectionStrings__Cmms
              Value: !Sub "Server=tcp:${Database.Endpoint.Address},${Database.Endpoint.Port};Database=cmms;Encrypt=True;TrustServerCertificate=True;Connection Timeout=60"
            - { Name: Database__MigrateOnStartup, Value: "true" }
            - { Name: Storage__Provider, Value: S3 }
            - { Name: Storage__Bucket, Value: !Ref FilesBucket }
            - { Name: Storage__Region, Value: !Ref AWS::Region }
            - { Name: Auth__AllowRegistration, Value: !Ref AllowRegistration }
          Secrets:
            - { Name: Database__User, ValueFrom: !Sub "${DatabaseSecret}:username::" }
            - { Name: Database__Password, ValueFrom: !Sub "${DatabaseSecret}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cmms

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: PublicDefaultRoute
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      # One task: the PM scheduler and start-up migrations assume a single instance.
      DesiredCount: 1
      # Schema migrations run before the app answers health checks; allow time on the first start.
      HealthCheckGracePeriodSeconds: 300
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - ContainerName: cmms
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------- HTTPS front end (CloudFront)
  # Forwards everything the app needs (cookies, query strings, headers) plus CloudFront-Forwarded-Proto.
  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-${AWS::Region}-app"
        Comment: 4C CMMS - forward everything to the app
        HeadersConfig:
          HeaderBehavior: allViewerAndWhitelistCloudFront
          Headers: [CloudFront-Forwarded-Proto]
        CookiesConfig: { CookieBehavior: all }
        QueryStringsConfig: { QueryStringBehavior: all }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "4C CMMS (${AWS::StackName}, ${AWS::Region})"
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: app
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # managed: CachingDisabled
          OriginRequestPolicyId: !Ref OriginRequestPolicy
        CacheBehaviors:
          # Built web assets have content hashes in their names, so they can be cached and compressed at the edge.
          - PathPattern: /assets/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # managed: CachingOptimized

Outputs:
  Url:
    Description: Web address of the app
    Value: !Sub "https://${Distribution.DomainName}"
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroupName:
    Value: !Ref LogGroup
  FilesBucketName:
    Value: !Ref FilesBucket
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: Secrets Manager secret holding the database login
    Value: !Ref DatabaseSecret
