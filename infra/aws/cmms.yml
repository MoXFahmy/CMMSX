AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CMX - web app + API on ECS Fargate behind an internal Application Load Balancer that only CloudFront (HTTPS, with the
  cmms-edge WAF web ACL) reaches, through a VPC origin; RDS for SQL Server, S3 for attachments. Deployed by
  .github/workflows/deploy-aws.yml; see docs/DEPLOY_AWS.md.

Parameters:
  ImageUri:
    Type: String
    Description: Container image to run, e.g. 123456789012.dkr.ecr.me-central-1.amazonaws.com/cmms:<commit>
  OriginPrefixListId:
    Type: String
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: >-
      Managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region: CloudFront's VPC origin reaches the
      internal load balancer from these addresses. The deployment workflow looks it up.
  AllowRegistration:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Let visitors create new organizations from the sign-in page.
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class for SQL Server Express (db.t3.micro, db.t3.small, ...). Changing it causes a short restart.
  VpcCidr:
    Type: String
    Default: 10.60.0.0/16
    Description: Address range of the new VPC created for the app (it is not connected to your other VPCs).
  MailDomain:
    Type: String
    Default: ""
    Description: >-
      Domain notification e-mails are sent from, e.g. example.com. When set, an Amazon SES identity with DKIM is created;
      add the three DKIM records from the stack outputs at your DNS host. Leave empty for no e-mail.
  MailFromAddress:
    Type: String
    Default: ""
    Description: Address notifications are sent from, on MailDomain, e.g. notifications@example.com. Leave empty to keep e-mail off.
  MailAllowedOrganizations:
    Type: String
    Default: ""
    Description: >-
      Organizations (short names, comma-separated, or * for all) allowed to send e-mail. While sign-up is open, only
      these can; empty with sign-up closed means every organization.

  Domain:
    Type: String
    Default: ""
    Description: >-
      The app's own web address, e.g. cmms.example.com. Needs DomainCertificateArn. Point a DNS CNAME for it at the
      DistributionDomain output. The dxxxxxxxx.cloudfront.net address keeps working. Leave empty to use only that one.
  DomainCertificateArn:
    Type: String
    Default: ""
    Description: ARN of an issued ACM certificate for Domain, requested in us-east-1 (CloudFront only uses certificates from there).
  PushSecretArn:
    Type: String
    Default: ""
    Description: >-
      ARN of a Secrets Manager secret (in this region) holding the Firebase service account key file, for push
      notifications to the Android app. You create the secret yourself; leave empty for no push.
  AnthropicSecretArn:
    Type: String
    Default: ""
    Description: >-
      ARN of a Secrets Manager secret (in this region) holding the Claude API key (plain text) for the AI assistant. You
      create the secret yourself with your own key; leave empty for no AI.
  AiMonthlyCeiling:
    Type: Number
    Default: 300
    MinValue: 0
    Description: AI actions a month that any organization may use at most (each organization can set a lower limit).
  BoundaryPolicyArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:policy/cmms/cmms-boundary-.+$"
    Description: >-
      Permissions boundary every role under /cmms/ carries (output BoundaryPolicyArn of the cmms-github setup stack).
      The CloudFormation execution role only creates or changes roles that carry it.
  WebAclArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:wafv2:us-east-1:[0-9]{12}:global/webacl/.+$"
    Description: WAF web ACL for the CloudFront distribution (output WebAclArn of the cmms-edge stack in us-east-1).
  RequireEmailConfirmation:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      New organizations confirm their owner's e-mail address before use. Turn on only once Amazon SES has production
      access (in the SES sandbox the confirmation e-mail only reaches verified addresses).
  DrVaultArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:backup:[a-z0-9-]+:[0-9]{12}:backup-vault:.+$"
    Description: Locked AWS Backup vault in Ireland that receives the snapshot copies (output DrVaultArn of the cmms-dr stack).
  DrKeyArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:kms:eu-west-1:[0-9]{12}:key/.+$"
    Description: KMS key in Ireland that encrypts the database's replicated automated backups (output DrKeyArn of cmms-dr).
  FilesCopyBucketArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:s3:::.+$"
    Description: Object Lock bucket in Ireland that receives the attachments (output FilesCopyBucketArn of cmms-dr).
  BackupsCopyBucketArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:s3:::.+$"
    Description: Object Lock bucket in Ireland that receives the weekly database exports (output BackupsCopyBucketArn of cmms-dr).
  DbMajorEngineVersion:
    Type: String
    AllowedPattern: "^[0-9]{2}\\.00$"
    Default: "16.00"
    Description: >-
      Major version of the database engine (RDS console, Configuration, Engine version: the first two parts, e.g. 16.00
      for SQL Server 2022). The native-backup option group must match it.
  IrelandDatabaseCopy:
    Type: String
    AllowedValues: [replication, hourly-snapshots]
    Default: replication
    Description: >-
      How the database reaches Ireland between the daily snapshots. replication = RDS cross-Region automated backups (point in
      time restore in Ireland, about 15 minutes of changes at risk); hourly-snapshots = the fallback if RDS refuses it: an
      hourly AWS Backup snapshot copied to the Ireland vault and kept 7 days there (1-2 hours at risk).
  AlertEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+$"
    Description: >-
      Address that receives the alarms, backup failures, restore test results and GuardDuty findings (topic cmms-alerts).
      The recipient must confirm the subscription e-mail once. Leave empty for no subscription.
  CreateGuardDutyDetector:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Create the GuardDuty detector in this Region. Set false when the account already has one here (only one is allowed
      per Region); then switch on S3 protection and ECS Fargate runtime monitoring on that detector by hand.

Conditions:
  HasDomain: !And [!Not [!Equals [!Ref Domain, ""]], !Not [!Equals [!Ref DomainCertificateArn, ""]]]
  HasMailDomain: !Not [!Equals [!Ref MailDomain, ""]]
  HasMailFrom: !Not [!Equals [!Ref MailFromAddress, ""]]
  HasPush: !Not [!Equals [!Ref PushSecretArn, ""]]
  HasAi: !Not [!Equals [!Ref AnthropicSecretArn, ""]]
  CopyByReplication: !Equals [!Ref IrelandDatabaseCopy, replication]
  CopyByHourlySnapshots: !Equals [!Ref IrelandDatabaseCopy, hourly-snapshots]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  MakeDetector: !Equals [!Ref CreateGuardDutyDetector, "true"]

Resources:
  # ---------------------------------------------------------------- Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets: the app task (it needs outbound internet for ECR, S3, logs, secrets, SES, Firebase and Claude).
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-1" }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-2" }]

  # Private subnets (no internet route): the database and the internal load balancer, which CloudFront reaches through
  # its VPC origin.
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-1" }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-2" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # The VPC origin's traffic comes from CloudFront's origin-facing addresses (option 1 in the CloudFront guide; option 2,
  # the CloudFront-VPCOrigins-Service-SG group, only exists after the VPC origin does). The load balancer is internal,
  # so nothing outside the VPC can reach it whatever this rule says.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref OriginPrefixListId
          Description: CloudFront origin-facing servers

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App port from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: Load balancer

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SQL Server from the app only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: App

  # The monthly restore test's temporary database (0.29.0): nothing may connect to it. It only has to come up.
  RestoreTestSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Monthly restore test database - no inbound
      VpcId: !Ref Vpc

  # ---------------------------------------------------------------- Database (RDS for SQL Server)
  # Removed with the stack; a restored database snapshot can be given a new password in the RDS console.
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub "CMX database login (${AWS::StackName})"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"cmmsadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} database subnets"
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  # RDS writes the weekly native export (msdb.dbo.rds_backup_database, started by the app) into the backups bucket as this
  # role, which can reach that bucket only.
  NativeBackupRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /cmms/
      PermissionsBoundary: !Ref BoundaryPolicyArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: rds.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: backups-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt BackupsBucket.Arn
              # Read too, so a native restore from the same bucket works with the same role.
              - Effect: Allow
                Action: [s3:GetObjectAttributes, s3:GetObject, s3:PutObject, s3:ListMultipartUploadParts, s3:AbortMultipartUpload]
                Resource: !Sub "${BackupsBucket.Arn}/*"

  # Native backup and restore. Adding the option or attaching the group needs no restart. Snapshots (AWS Backup's, the
  # final one) keep naming the group, and RDS refuses to delete a group a snapshot uses: so it stays when the stack is
  # deleted or it is replaced (a DbMajorEngineVersion change). Removed only if the deploy that made it rolls back (no
  # snapshot can use it yet; its name is generated, so it would not block a retry either way).
  OptionGroup:
    Type: AWS::RDS::OptionGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      EngineName: sqlserver-ex
      MajorEngineVersion: !Ref DbMajorEngineVersion
      OptionGroupDescription: !Sub "${AWS::StackName} native backup to S3"
      OptionConfigurations:
        - OptionName: SQLSERVER_BACKUP_RESTORE
          OptionSettings:
            - Name: IAM_ROLE_ARN
              Value: !GetAtt NativeBackupRole.Arn

  # Backups (0.29.0): point in time restore for 35 days in London and, by default, a continuous copy in Ireland (RDS
  # cross-Region automated backups, encrypted with the Ireland key, kept 7 days). None of these settings replaces or
  # restarts the instance (RDS: no downtime for a retention change between non-zero values, an option group change, or
  # backup replication).
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: sqlserver-ex
      LicenseModel: license-included
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 35
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      OptionGroupName: !Ref OptionGroup
      AutomaticBackupReplicationRegion: !If [CopyByReplication, eu-west-1, !Ref AWS::NoValue]
      AutomaticBackupReplicationKmsKeyId: !If [CopyByReplication, !Ref DrKeyArn, !Ref AWS::NoValue]
      AutomaticBackupReplicationRetentionPeriod: !If [CopyByReplication, 7, !Ref AWS::NoValue]

  # ---------------------------------------------------------------- Attachments (S3)
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      # Deleted or replaced files stay recoverable for 90 days.
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      # Every new file and version is copied to the Object Lock bucket in Ireland (cmms-dr). Deletions are not: a delete
      # marker stays here, so a file deleted in London (by mistake or by an attacker) is still current in Ireland. Files
      # uploaded before replication was set up need one S3 Batch Replication job (see docs/SECURITY_AND_BACKUPS.md).
      # Replication metrics give the failed-copy count that FilesReplicationFailedAlarm watches.
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: to-ireland
            Status: Enabled
            Priority: 1
            Filter: { Prefix: "" }
            DeleteMarkerReplication: { Status: Disabled }
            Destination:
              Bucket: !Ref FilesCopyBucketArn
              Metrics: { Status: Enabled }
      # GuardDuty Malware Protection (MalwareProtectionPlan) listens to the bucket's events through EventBridge; set here
      # too, so a later stack update keeps it on.
      NotificationConfiguration:
        EventBridgeConfiguration: { EventBridgeEnabled: true }

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt FilesBucket.Arn, !Sub "${FilesBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------------------------------------------------------------- Backups (0.29.0)
  # The weekly native export (.bak, restorable on any SQL Server): written by RDS as NativeBackupRole, kept 90 days, and
  # copied to the Object Lock bucket in Ireland (deletions not copied, like the files). Kept when the stack is deleted;
  # removed only if the deploy that created it rolls back (still empty then), so its fixed name doesn't block the retry.
  BackupsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "cmms-backups-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-90-days
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      # Replication metrics give the failed-copy count that ExportsReplicationFailedAlarm watches.
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: to-ireland
            Status: Enabled
            Priority: 1
            Filter: { Prefix: "" }
            DeleteMarkerReplication: { Status: Disabled }
            Destination:
              Bucket: !Ref BackupsCopyBucketArn
              Metrics: { Status: Enabled }

  BackupsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt BackupsBucket.Arn, !Sub "${BackupsBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # S3 copies new objects of both buckets to Ireland as this role. Into Object Lock buckets it also reads each object's
  # retention and legal hold; the replicas then take the Ireland bucket's default retention.
  ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /cmms/
      PermissionsBoundary: !Ref BoundaryPolicyArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sts:AssumeRole

  # A policy of its own: the buckets name the role in their replication settings, so the role can't name the buckets.
  ReplicationPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref ReplicationRole
      PolicyName: replicate-to-ireland
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:GetReplicationConfiguration, s3:ListBucket]
            Resource: [!GetAtt FilesBucket.Arn, !GetAtt BackupsBucket.Arn]
          - Effect: Allow
            Action:
              - s3:GetObjectVersionForReplication
              - s3:GetObjectVersionAcl
              - s3:GetObjectVersionTagging
              - s3:GetObjectRetention
              - s3:GetObjectLegalHold
            Resource: [!Sub "${FilesBucket.Arn}/*", !Sub "${BackupsBucket.Arn}/*"]
          - Effect: Allow
            Action: [s3:ReplicateObject, s3:ReplicateDelete, s3:ReplicateTags]
            Resource: [!Sub "${FilesCopyBucketArn}/*", !Sub "${BackupsCopyBucketArn}/*"]

  # AWS Backup takes the snapshots, copies them to Ireland and runs the monthly restore test as this role.
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /cmms/
      PermissionsBoundary: !Ref BoundaryPolicyArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: backup.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores"
      Policies:
        # The restored test database takes the snapshot's option group, which names NativeBackupRole.
        - PolicyName: restore-with-native-backup-option
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt NativeBackupRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: rds.amazonaws.com }

  # London vault: nobody but the account's root user may delete a recovery point (the snapshots still expire on their
  # lifecycle; AWS Backup does that itself). Kept when the stack is deleted, since it holds the snapshots; removed only if
  # the deploy that created it rolls back (still empty then), so its fixed name doesn't block the retry.
  BackupVault:
    Type: AWS::Backup::BackupVault
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Sub "${AWS::StackName}-vault"
      AccessPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyRootDeletesRecoveryPoints
            Effect: Deny
            Principal: "*"
            Action: backup:DeleteRecoveryPoint
            Resource: "*"
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"

  # Daily (35 days) and monthly (12 months) snapshots, each copied to the locked Ireland vault with the same retention. No
  # continuous backup here: RDS keeps its own point in time restore (BackupRetentionPeriod), which AWS Backup would take over.
  # The start window lets a job wait out the RDS backup window if they meet.
  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub "${AWS::StackName}-database"
        BackupPlanRule:
          - RuleName: daily
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 1 * * ? *)
            StartWindowMinutes: 480
            CompletionWindowMinutes: 1440
            Lifecycle: { DeleteAfterDays: 35 }
            CopyActions:
              - DestinationBackupVaultArn: !Ref DrVaultArn
                Lifecycle: { DeleteAfterDays: 35 }
          - RuleName: monthly
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 1 1 * ? *)
            StartWindowMinutes: 480
            CompletionWindowMinutes: 1440
            Lifecycle: { DeleteAfterDays: 365 }
            CopyActions:
              - DestinationBackupVaultArn: !Ref DrVaultArn
                Lifecycle: { DeleteAfterDays: 365 }
          # Fallback only (IrelandDatabaseCopy=hourly-snapshots): 7 days in Ireland, the locked vault's minimum.
          - !If
            - CopyByHourlySnapshots
            - RuleName: hourly
              TargetBackupVault: !Ref BackupVault
              ScheduleExpression: cron(0 * * * ? *)
              StartWindowMinutes: 60
              CompletionWindowMinutes: 180
              Lifecycle: { DeleteAfterDays: 2 }
              CopyActions:
                - DestinationBackupVaultArn: !Ref DrVaultArn
                  Lifecycle: { DeleteAfterDays: 7 }
            - !Ref AWS::NoValue

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: database
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${Database}"

  # Once a month (the 2nd, 04:00 UTC) AWS Backup restores the latest London snapshot into a temporary db.t3.micro in the
  # private subnets, behind a security group with no inbound rules, and deletes it after 4 hours. "Checked" means the
  # restore job completed and the instance came up; the result goes to the alert topic (see RestoreTestResults).
  RestoreTestingPlan:
    Type: AWS::Backup::RestoreTestingPlan
    Properties:
      RestoreTestingPlanName: cmms_monthly_restore_test
      ScheduleExpression: cron(0 4 2 * ? *)
      StartWindowHours: 8
      RecoveryPointSelection:
        Algorithm: LATEST_WITHIN_WINDOW
        IncludeVaults: [!GetAtt BackupVault.BackupVaultArn]
        RecoveryPointTypes: [SNAPSHOT]
        SelectionWindowDays: 7

  RestoreTestingSelection:
    Type: AWS::Backup::RestoreTestingSelection
    Properties:
      RestoreTestingPlanName: !Ref RestoreTestingPlan
      RestoreTestingSelectionName: cmms_database
      ProtectedResourceType: RDS
      ProtectedResourceArns:
        - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${Database}"
      IamRoleArn: !GetAtt BackupRole.Arn
      ValidationWindowHours: 4
      RestoreMetadataOverrides:
        dbInstanceClass: db.t3.micro
        dbSubnetGroupName: !Ref DatabaseSubnetGroup
        vpcSecurityGroupIds: !Sub '["${RestoreTestSecurityGroup.GroupId}"]'

  # ---------------------------------------------------------------- App (ECS Fargate)
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 90

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]

  # Used by ECS to pull the image, write logs and read the database login.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /cmms/
      PermissionsBoundary: !Ref BoundaryPolicyArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: read-database-login
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseSecret
                  - !If [HasPush, !Ref PushSecretArn, !Ref AWS::NoValue]
                  - !If [HasAi, !Ref AnthropicSecretArn, !Ref AWS::NoValue]

  # Used by the app itself: attachments in its own bucket only.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /cmms/
      PermissionsBoundary: !Ref BoundaryPolicyArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: attachments
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${FilesBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket # lets a missing file read as "not found" rather than "access denied"
                Resource: !GetAtt FilesBucket.Arn
        # E-mail through Amazon SES. While the account is in the SES sandbox, SES also checks permission on each
        # (verified) recipient address, so the grant covers this account's identities in this region.
        - !If
          - HasMailDomain
          - PolicyName: email
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [ses:SendEmail, ses:SendRawEmail]
                  Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
          - !Ref AWS::NoValue

  # The sending domain in Amazon SES, signed with DKIM (Easy DKIM: three CNAME records, listed in the outputs).
  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasMailDomain
    Properties:
      EmailIdentity: !Ref MailDomain
      DkimAttributes: { SigningEnabled: true }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: cmms
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - { Name: ASPNETCORE_ENVIRONMENT, Value: Production }
            # One JSON line per log entry (0.29.0): Message is the text, State its values. The metric filters read them.
            - { Name: Logging__Console__FormatterName, Value: json }
            # TLS ends at CloudFront, which reports the original scheme in CloudFront-Forwarded-Proto.
            - { Name: ASPNETCORE_FORWARDEDHEADERS_ENABLED, Value: "true" }
            - { Name: ForwardedHeaders__ProtoHeaderName, Value: CloudFront-Forwarded-Proto }
            # The visitor's own address for the sign-in and sign-up limits (0.29.0), from CloudFront. Never stored or logged.
            - { Name: Abuse__ViewerAddressHeader, Value: CloudFront-Viewer-Address }
            # Traffic to the database stays inside the VPC; the RDS certificate is not in the container's trust store.
            - Name: ConnectionStrings__Cmms
              Value: !Sub "Server=tcp:${Database.Endpoint.Address},${Database.Endpoint.Port};Database=cmms;Encrypt=True;TrustServerCertificate=True;Connection Timeout=60"
            - { Name: Database__MigrateOnStartup, Value: "true" }
            - { Name: Storage__Provider, Value: S3 }
            - { Name: Storage__Bucket, Value: !Ref FilesBucket }
            - { Name: Storage__Region, Value: !Ref AWS::Region }
            # The weekly native export's bucket (0.29.0); the app starts it Sundays from 02:00 UTC.
            - { Name: Backups__S3Arn, Value: !GetAtt BackupsBucket.Arn }
            - { Name: Auth__AllowRegistration, Value: !Ref AllowRegistration }
            # New organizations confirm their e-mail before use (0.29.0); needs SES production access.
            - { Name: Auth__RequireEmailConfirmation, Value: !Ref RequireEmailConfirmation }
            # Links in e-mails point here.
            - Name: App__PublicUrl
              Value: !If [HasDomain, !Sub "https://${Domain}", !Sub "https://${Distribution.DomainName}"]
            - !If [HasMailFrom, { Name: Email__Provider, Value: Ses }, !Ref AWS::NoValue]
            - !If [HasMailFrom, { Name: Email__From, Value: !Ref MailFromAddress }, !Ref AWS::NoValue]
            - !If [HasMailFrom, { Name: Email__Region, Value: !Ref AWS::Region }, !Ref AWS::NoValue]
            - !If [HasMailFrom, { Name: Email__AllowedOrganizations, Value: !Ref MailAllowedOrganizations }, !Ref AWS::NoValue]
            # The AI assistant (0.15.0): the most AI actions a month any organization may use.
            - { Name: Ai__MonthlyCeiling, Value: !Ref AiMonthlyCeiling }
          Secrets:
            - { Name: Database__User, ValueFrom: !Sub "${DatabaseSecret}:username::" }
            - { Name: Database__Password, ValueFrom: !Sub "${DatabaseSecret}:password::" }
            # Push notifications (0.11.0): the Firebase key, from the secret you created. Never in an environment variable.
            - !If [HasPush, { Name: Push__ServiceAccountJson, ValueFrom: !Ref PushSecretArn }, !Ref AWS::NoValue]
            # The AI assistant (0.15.0): the Claude API key, from the secret you created. Never in an environment variable.
            - !If [HasAi, { Name: Ai__ApiKey, ValueFrom: !Ref AnthropicSecretArn }, !Ref AWS::NoValue]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cmms

  # Internal (0.29.0): no public address, in the private subnets; only CloudFront's VPC origin reaches it. It replaced the
  # internet-facing LoadBalancer, TargetGroup and Listener (a Scheme change replaces a load balancer, so these are new
  # resources and the old ones were removed in the same deploy).
  InternalLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }

  InternalTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  InternalListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref InternalTargetGroup

  # After the distribution: the cutover moves CloudFront to the internal load balancer first, then this service's task to its
  # target group (the gap between the two is the switch's only downtime). The listener must exist before the service uses
  # the target group.
  Service:
    Type: AWS::ECS::Service
    DependsOn: [InternalListener, Distribution]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      # One task: the PM scheduler and start-up migrations assume a single instance.
      DesiredCount: 1
      # Schema migrations run before the app answers health checks; allow time on the first start.
      HealthCheckGracePeriodSeconds: 300
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - ContainerName: cmms
          ContainerPort: 8080
          TargetGroupArn: !Ref InternalTargetGroup

  # ---------------------------------------------------------------- Detection (0.29.0): GuardDuty
  # S3 protection and runtime monitoring of the Fargate task (GuardDuty adds its agent to each new task and a VPC endpoint
  # to the VPC; turn runtime monitoring off before deleting the stack, or that endpoint keeps the VPC). The CloudTrail
  # trail lives in the cmms-github setup stack, out of the pipeline's reach.
  Detector:
    Type: AWS::GuardDuty::Detector
    Condition: MakeDetector
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
      Features:
        - Name: S3_DATA_EVENTS
          Status: ENABLED
        - Name: RUNTIME_MONITORING
          Status: ENABLED
          AdditionalConfiguration:
            - Name: ECS_FARGATE_AGENT_MANAGEMENT
              Status: ENABLED

  # GuardDuty scans each new upload in the files bucket and tags it (GuardDutyMalwareScanStatus); a malicious file becomes a
  # finding, which reaches the alert topic (GuardDutyFindings). Alert only: the app still serves the file.
  MalwareRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /cmms/
      PermissionsBoundary: !Ref BoundaryPolicyArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: malware-protection-plan.guardduty.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: scan-files
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [events:PutRule, events:DeleteRule, events:PutTargets, events:RemoveTargets]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
                Condition:
                  StringLike: { "events:ManagedBy": malware-protection-plan.guardduty.amazonaws.com }
              - Effect: Allow
                Action: [events:DescribeRule, events:ListTargetsByRule]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
              - Effect: Allow
                Action: [s3:PutObjectTagging, s3:GetObjectTagging, s3:PutObjectVersionTagging, s3:GetObjectVersionTagging]
                Resource: !Sub "${FilesBucket.Arn}/*"
              - Effect: Allow
                Action: [s3:PutBucketNotification, s3:GetBucketNotification, s3:ListBucket]
                Resource: !GetAtt FilesBucket.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${FilesBucket.Arn}/malware-protection-resource-validation-object"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${FilesBucket.Arn}/*"

  MalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    Properties:
      Role: !GetAtt MalwareRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref FilesBucket
      Actions:
        Tagging: { Status: ENABLED }

  # ---------------------------------------------------------------- Alarms (0.29.0): the on-call inbox
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cmms-alerts
      DisplayName: CMX alerts

  # The topic's default policy (this account's principals and CloudWatch alarms) plus EventBridge, for the backup, restore
  # test and GuardDuty rules below.
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ThisAccount
            Effect: Allow
            Principal: { AWS: "*" }
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals: { "AWS:SourceOwner": !Ref AWS::AccountId }
          - Sid: EventBridgeRules
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              ArnLike: { "aws:SourceArn": !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*" }

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # The app's log lines as metrics (Logging__Console__FormatterName=json: Message holds the text, State the values).
  SignInFailedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.Message = "SignInFailed" }'
      MetricTransformations:
        - MetricNamespace: !Sub "CMX/${AWS::StackName}"
          MetricName: SignInFailed
          MetricValue: "1"
          Unit: Count

  # "DatabaseSize mb={Mb}", once a day: the value is State.Mb.
  DatabaseSizeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.Message = "DatabaseSize mb=*" }'
      MetricTransformations:
        - MetricNamespace: !Sub "CMX/${AWS::StackName}"
          MetricName: DatabaseSizeMb
          MetricValue: $.State.Mb
          Unit: Megabytes

  BackupExportErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.Message = "BackupExport status=ERROR*" }'
      MetricTransformations:
        - MetricNamespace: !Sub "CMX/${AWS::StackName}"
          MetricName: BackupExportError
          MetricValue: "1"
          Unit: Count

  # 0 for every other log line, so a week in which the app ran but never exported reads as 0, not as missing data.
  BackupExportSuccessMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.Message = "BackupExport status=SUCCESS*" }'
      MetricTransformations:
        - MetricNamespace: !Sub "CMX/${AWS::StackName}"
          MetricName: BackupExportSuccess
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  SiteErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-site-errors"
      AlarmDescription: More than 10 server errors (5xx from the load balancer or the app) in 5 minutes.
      Metrics:
        - Id: lb
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_5XX_Count
              Dimensions:
                - { Name: LoadBalancer, Value: !GetAtt InternalLoadBalancer.LoadBalancerFullName }
            Period: 300
            Stat: Sum
        - Id: app
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - { Name: LoadBalancer, Value: !GetAtt InternalLoadBalancer.LoadBalancerFullName }
            Period: 300
            Stat: Sum
        - Id: errors
          Label: Server errors
          Expression: FILL(lb, 0) + FILL(app, 0)
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # No data means the load balancer reports nothing, which counts as down. Made once the service uses the target group, so
  # an empty group during a cutover or a first deploy isn't reported.
  AppDownAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: Service
    Properties:
      AlarmName: !Sub "${AWS::StackName}-app-down"
      AlarmDescription: No healthy app task behind the load balancer for 3 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt InternalTargetGroup.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt InternalLoadBalancer.LoadBalancerFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  DatabaseBusyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-database-busy"
      AlarmDescription: Database CPU above 85% for 15 minutes.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  DatabaseDiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-database-disk"
      AlarmDescription: Database free storage below 3 GB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3221225472 # 3 GiB in bytes
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # The Express edition stops each database at 10 GB; this leaves room to move to a bigger edition. A daily value, so a
  # missing day keeps the alarm as it is (DatabaseSizeNotMeasuredAlarm catches the measurement stopping).
  DatabaseSizeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-database-size"
      AlarmDescription: The database's data files reached 7 GB (7,168 MB) of the 10 GB SQL Server Express cap.
      Namespace: !Sub "CMX/${AWS::StackName}"
      MetricName: DatabaseSizeMb
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 7168
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: ignore
      AlarmActions: [!Ref AlertTopic]

  # The size alarm's watchdog: no "DatabaseSize mb=" line for 2 days (the app measures once per UTC date, so normal gaps are
  # about 24 hours). Both 1-day periods of the last 48 hours empty = alarm; no data at all counts as empty. Made once the
  # service runs the new task, which measures 2 minutes after it starts.
  DatabaseSizeNotMeasuredAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: Service
    Properties:
      AlarmName: !Sub "${AWS::StackName}-database-size-not-measured"
      AlarmDescription: No daily database size measurement (DatabaseSize mb= in the app log) for 2 days; the 7 GB alarm is blind.
      Namespace: !Sub "CMX/${AWS::StackName}"
      MetricName: DatabaseSizeMb
      Statistic: SampleCount
      Period: 86400
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  SignInAttackAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-sign-in-attack"
      AlarmDescription: More than 50 failed sign-ins in 5 minutes (password guessing).
      Namespace: !Sub "CMX/${AWS::StackName}"
      MetricName: SignInFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Native export failed, part 1: any "BackupExport status=ERROR" line (each failed try, Sundays, hourly until it works).
  NativeExportErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-native-export-error"
      AlarmDescription: The weekly native database export reported an error (BackupExport status=ERROR in the app log).
      Namespace: !Sub "CMX/${AWS::StackName}"
      MetricName: BackupExportError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Native export failed, part 2: no SUCCESS line in a whole calendar week (Monday to Monday, UTC). CloudWatch can't look
  # back 8 days (an alarm sees at most 7), and a rolling 7 days would fire whenever one Sunday's export finishes a little
  # later than the last; each calendar week holds exactly one Sunday. A missed Sunday alarms the Monday after, at most
  # 7 days 22 hours after the previous export, and stays in alarm until a week with an export ends.
  NativeExportMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-native-export-missing"
      AlarmDescription: No successful weekly native database export last week (no BackupExport status=SUCCESS line).
      Namespace: !Sub "CMX/${AWS::StackName}"
      MetricName: BackupExportSuccess
      Statistic: Sum
      Period: 604800
      EvaluationPeriods: 1
      EvaluationWindow:
        WallClockWindow: { Timezone: UTC }
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # A file, or a weekly export, that S3 failed to copy to Ireland (replication metrics, published in the source bucket's
  # region). Any failed operation in 5 minutes fires. Missing data keeps the state (AWS's advice for replication metrics):
  # no data means nothing was replicated, so the alarm stays on until a copy succeeds again, and an e-mail goes out once.
  FilesReplicationFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-files-replication-failed"
      AlarmDescription: S3 failed to copy one or more uploaded files to the Ireland bucket (OperationsFailedReplication).
      Namespace: AWS/S3
      MetricName: OperationsFailedReplication
      Dimensions:
        - { Name: SourceBucket, Value: !Ref FilesBucket }
        - { Name: DestinationBucket, Value: !Select [5, !Split [":", !Ref FilesCopyBucketArn]] }
        - { Name: RuleId, Value: to-ireland }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: ignore
      AlarmActions: [!Ref AlertTopic]

  ExportsReplicationFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-exports-replication-failed"
      AlarmDescription: S3 failed to copy the weekly database export to the Ireland bucket (OperationsFailedReplication).
      Namespace: AWS/S3
      MetricName: OperationsFailedReplication
      Dimensions:
        - { Name: SourceBucket, Value: !Ref BackupsBucket }
        - { Name: DestinationBucket, Value: !Select [5, !Split [":", !Ref BackupsCopyBucketArn]] }
        - { Name: RuleId, Value: to-ireland }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: ignore
      AlarmActions: [!Ref AlertTopic]

  # AWS Backup: a snapshot or its copy to Ireland that failed, was stopped or never started in its window.
  BackupJobFailures:
    Type: AWS::Events::Rule
    Properties:
      Description: CMX - AWS Backup backup or copy job FAILED, ABORTED or EXPIRED
      EventPattern:
        source: [aws.backup]
        detail-type: [Backup Job State Change, Copy Job State Change]
        detail:
          state: [FAILED, ABORTED, EXPIRED]
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopic

  # Every result of the monthly restore test, success too: the e-mail carries the job's creation and completion times.
  # Only restore testing jobs carry restoreTestingPlanArn (this account has one plan, RestoreTestingPlan).
  RestoreTestResults:
    Type: AWS::Events::Rule
    Properties:
      Description: CMX - monthly restore test COMPLETED, FAILED or ABORTED
      EventPattern:
        source: [aws.backup]
        detail-type: [Restore Job State Change]
        detail:
          status: [COMPLETED, FAILED, ABORTED]
          restoreTestingPlanArn: [{ exists: true }]
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopic

  GuardDutyFindings:
    Type: AWS::Events::Rule
    Properties:
      Description: CMX - GuardDuty findings of severity 4 (medium) or higher
      EventPattern:
        source: [aws.guardduty]
        detail-type: [GuardDuty Finding]
        detail:
          severity: [{ numeric: [">=", 4] }]
      Targets:
        - Id: alert-topic
          Arn: !Ref AlertTopic

  # ---------------------------------------------------------------- HTTPS front end (CloudFront)
  # Forwards everything the app needs (cookies, query strings, headers) plus CloudFront-Forwarded-Proto and the visitor's
  # address (CloudFront-Viewer-Address, for the app's per-address limits).
  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-${AWS::Region}-app"
        Comment: CMX - forward everything to the app
        HeadersConfig:
          HeaderBehavior: allViewerAndWhitelistCloudFront
          Headers: [CloudFront-Forwarded-Proto, CloudFront-Viewer-Address]
        CookiesConfig: { CookieBehavior: all }
        QueryStringsConfig: { QueryStringBehavior: all }

  # CloudFront's private way into the VPC (HTTP on port 80 to the internal load balancer, inside AWS's network). Creating it
  # takes up to 15 minutes. CloudFront needs an internet gateway on the VPC to accept it (it routes nothing through it).
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn: InternetGatewayAttachment
    Properties:
      VpcOriginEndpointConfig:
        # CloudFront is global: the region keeps a rebuild in another region from colliding with the old stack's name.
        Name: !Sub "${AWS::StackName}-${AWS::Region}-app"
        Arn: !Ref InternalLoadBalancer
        HTTPPort: 80
        OriginProtocolPolicy: http-only

  # After the database: its changes (option group, backup copies) finish before CloudFront switches origin, so a failure
  # there rolls back before the cutover starts.
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: Database
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "CMX (${AWS::StackName}, ${AWS::Region})"
        # The cmms-edge web ACL (us-east-1): managed rules and per-address rate limits in front of everything.
        WebACLId: !Ref WebAclArn
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Aliases: !If [HasDomain, [!Ref Domain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref DomainCertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: app
            DomainName: !GetAtt InternalLoadBalancer.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt VpcOrigin.Id
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # managed: CachingDisabled
          OriginRequestPolicyId: !Ref OriginRequestPolicy
        CacheBehaviors:
          # Built web assets have content hashes in their names, so they can be cached and compressed at the edge.
          - PathPattern: /assets/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # managed: CachingOptimized

Outputs:
  Url:
    Description: Web address of the app
    Value: !If [HasDomain, !Sub "https://${Domain}", !Sub "https://${Distribution.DomainName}"]
  DistributionDomain:
    Description: The CloudFront address; with your own Domain, its DNS CNAME points here
    Value: !GetAtt Distribution.DomainName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroupName:
    Value: !Ref LogGroup
  FilesBucketName:
    Value: !Ref FilesBucket
  BackupsBucketName:
    Description: Bucket holding the weekly native database exports (replicated to Ireland)
    Value: !Ref BackupsBucket
  BackupVaultName:
    Description: London AWS Backup vault (daily and monthly snapshots; copies go to the Ireland vault)
    Value: !Ref BackupVault
  AlertTopicArn:
    Description: Topic cmms-alerts (alarms, backup failures, restore test results, GuardDuty findings)
    Value: !Ref AlertTopic
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: Secrets Manager secret holding the database login
    Value: !Ref DatabaseSecret
  MailDkimRecord1:
    Condition: HasMailDomain
    Description: DKIM record for the sending domain; add it at your DNS host as a CNAME
    Value: !Sub "${MailIdentity.DkimDNSTokenName1} CNAME ${MailIdentity.DkimDNSTokenValue1}"
  MailDkimRecord2:
    Condition: HasMailDomain
    Description: DKIM record for the sending domain; add it at your DNS host as a CNAME
    Value: !Sub "${MailIdentity.DkimDNSTokenName2} CNAME ${MailIdentity.DkimDNSTokenValue2}"
  MailDkimRecord3:
    Condition: HasMailDomain
    Description: DKIM record for the sending domain; add it at your DNS host as a CNAME
    Value: !Sub "${MailIdentity.DkimDNSTokenName3} CNAME ${MailIdentity.DkimDNSTokenValue3}"
