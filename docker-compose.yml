# Local full-stack run:  SA_PASSWORD='YourStr0ng!Pass' docker compose up --build   →  http://localhost:8080
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
  app:
    build: .
    depends_on:
      sql: { condition: service_healthy }
    environment:
      ConnectionStrings__Cmms: "Server=sql,1433;Database=Cmms;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    ports: ["8080:8080"]
    volumes: [files:/data]
volumes:
  sqldata:
  files:
