name: Deploy to AWS

# Deploys every green build of main to AWS (ECS Fargate + RDS + S3 + CloudFront), or on demand from the Actions tab,
# then tags the deployed commit vX.Y.Z from its VERSION file (docs/VERSIONING.md).
# It stays switched off (skipped) until the repository variables from docs/DEPLOY_AWS.md are set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      continue_rollback_stack:
        description: >-
          Recovery only: a stack stuck in UPDATE_ROLLBACK_FAILED. Pick it to run "continue update rollback" instead of
          deploying (the failed deploy's log prints the exact stack and resources to skip). Leave on none to deploy.
        type: choice
        options: [none, cmms-app, cmms-edge]
        default: none
      resources_to_skip:
        description: Recovery only - the logical resource ids to skip, comma-separated (copy them from the failed deploy's log).
        type: string
        default: ""

permissions:
  id-token: write # sign in to AWS with GitHub's OIDC token, no stored keys
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    # Only this repository's own pushes to main (never pull requests from forks) and manual runs.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && (
        (github.event_name == 'workflow_dispatch' && (inputs.continue_rollback_stack == '' || inputs.continue_rollback_stack == 'none')) || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    # Build, the edge stack, up to 3 hours waiting for the app's stack (CFN_WAIT_MINUTES) and the version check.
    timeout-minutes: 270
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK: cmms-app
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      ALLOW_REGISTRATION: ${{ vars.CMMS_ALLOW_REGISTRATION || 'true' }}
      DB_INSTANCE_CLASS: ${{ vars.CMMS_DB_INSTANCE_CLASS || 'db.t3.micro' }}
      # E-mail (optional): the sending domain and address. Empty keeps e-mail off. See docs/DEPLOY_AWS.md.
      MAIL_DOMAIN: ${{ vars.CMMS_MAIL_DOMAIN }}
      MAIL_FROM_ADDRESS: ${{ vars.CMMS_MAIL_FROM_ADDRESS }}
      MAIL_ALLOWED_ORGS: ${{ vars.CMMS_MAIL_ALLOWED_ORGS }}
      DOMAIN: ${{ vars.CMMS_DOMAIN }}
      DOMAIN_CERTIFICATE_ARN: ${{ vars.CMMS_DOMAIN_CERTIFICATE_ARN }}
      # Push notifications (optional): ARN of the Secrets Manager secret holding the Firebase key. See docs/DEPLOY_AWS.md.
      PUSH_SECRET_ARN: ${{ vars.CMMS_PUSH_SECRET_ARN }}
      # AI assistant (optional): ARN of the Secrets Manager secret holding the Claude API key. See docs/AI_ASSISTANT.md.
      ANTHROPIC_SECRET_ARN: ${{ vars.CMMS_ANTHROPIC_SECRET_ARN }}
      # Security and backups (0.29.0). The alert address is required; the rest have safe defaults.
      ALERT_EMAIL: ${{ vars.CMMS_ALERT_EMAIL }}
      WAF_MODE: ${{ vars.CMMS_WAF_MODE || 'count' }}
      REQUIRE_EMAIL_CONFIRMATION: ${{ vars.CMMS_REQUIRE_EMAIL_CONFIRMATION || 'false' }}
      CREATE_GUARDDUTY_LONDON: ${{ vars.CMMS_CREATE_GUARDDUTY_LONDON || 'true' }}
      CREATE_GUARDDUTY_US_EAST: ${{ vars.CMMS_CREATE_GUARDDUTY_US_EAST || 'true' }}
      DB_MAJOR_ENGINE_VERSION: ${{ vars.CMMS_DB_MAJOR_ENGINE_VERSION || '16.00' }}
      IRELAND_DB_COPY: ${{ vars.CMMS_IRELAND_DB_COPY || 'replication' }}
      BOOTSTRAP_STACK: cmms-github
      DR_STACK: cmms-dr
      DR_REGION: eu-west-1
      EDGE_STACK: cmms-edge
      EDGE_REGION: us-east-1
    steps:
      - name: Check the settings
        run: |
          if [ -z "$ALERT_EMAIL" ]; then
            echo "::error::Set the repository variable CMMS_ALERT_EMAIL to the address that should receive CMX alarms, then re-run."
            exit 1
          fi
          case "$WAF_MODE" in count|block) ;; *) echo "::error::CMMS_WAF_MODE must be count or block, not '$WAF_MODE'."; exit 1 ;; esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Prepare the deploy helpers
        run: |
          # Shared by the steps below: deploy a stack through a change set that is printed first, and explain a failure.
          cat > "$RUNNER_TEMP/cfn.sh" <<'LIB'
          # shellcheck shell=bash
          CFN_POLL_SLEEP="${CFN_POLL_SLEEP:-30}"
          CFN_WAIT_MINUTES="${CFN_WAIT_MINUTES:-180}"

          cfn_need_setup() {
            echo "::error::Re-run deploy/aws/setup.sh in CloudShell (it sets up the deploy role and the recovery stack cmms-dr in Ireland, which this workflow only reads), then re-run this workflow."
            exit 1
          }

          # The stack's status, NONE when it does not exist, ACCESS_DENIED when the deploy role may not look.
          cfn_status() {
            local out err
            err=$(mktemp)
            if out=$(aws cloudformation describe-stacks --region "$2" --stack-name "$1" --query 'Stacks[0].StackStatus' --output text 2>"$err"); then
              echo "$out"
            elif grep -qiE 'does not exist' "$err"; then
              echo NONE
            elif grep -qiE 'AccessDenied|not authorized' "$err"; then
              echo ACCESS_DENIED
            else
              cat "$err" >&2
              return 1
            fi
          }

          # One output of a stack; empty when the stack or the output is missing.
          cfn_output() {
            local value
            value=$(aws cloudformation describe-stacks --region "$2" --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$3'].OutputValue | [0]" --output text 2>/dev/null || true)
            if [ "$value" = None ] || [ "$value" = null ]; then value=""; fi
            echo "$value"
          }

          cfn_events() {
            echo "Failed events of $1:"
            aws cloudformation describe-stack-events --region "$2" --stack-name "$1" --max-items 60 \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp, LogicalResourceId, ResourceStatusReason]" \
              --output table || true
          }

          # A stack that cannot finish rolling back: say exactly how to carry on.
          cfn_stuck_hint() {
            local ids
            ids=$(aws cloudformation describe-stack-events --region "$2" --stack-name "$1" --max-items 100 \
              --query "StackEvents[?ResourceStatus=='UPDATE_FAILED'].LogicalResourceId" --output text 2>/dev/null \
              | tr '\t' '\n' | grep -vx "$1" | sort -u | paste -sd, - || true)
            echo "::error::$1 is stuck in UPDATE_ROLLBACK_FAILED. Nothing more is deployed until it is unstuck."
            echo "Fix the cause shown above, then recover with the Run workflow button (Deploy to AWS: continue_rollback_stack = $1, resources_to_skip = ${ids:-<the failed logical ids>}), or in CloudShell:"
            echo "  aws cloudformation continue-update-rollback --region $2 --stack-name $1 --role-arn $3 --resources-to-skip ${ids//,/ }"
            echo "Then re-run this workflow."
          }

          # Waits while the stack is busy (any *_IN_PROGRESS status) and prints the status it ends in. The CLI's waiter gives up
          # after 60 minutes, which a first database with its copy to Ireland and the VPC origin can outlast; this waits up to
          # CFN_WAIT_MINUTES (180), showing the status in the log every 5 minutes and whenever it changes. Still busy at the cap:
          # prints that busy status (the caller says so). The stack can't be read (e.g. credentials gone): fails.
          cfn_wait() {
            local stack=$1 region=$2 status last="" n=0 step cap every
            step=$(( CFN_POLL_SLEEP > 0 ? CFN_POLL_SLEEP : 1 ))
            cap=$(( CFN_WAIT_MINUTES * 60 / step ))
            every=$(( 300 / step )); [ "$every" -ge 1 ] || every=1
            while :; do
              status=$(cfn_status "$stack" "$region") || return 1
              case "$status" in *_IN_PROGRESS) ;; *) echo "$status"; return 0 ;; esac
              if [ "$status" != "$last" ] || [ $(( n % every )) -eq 0 ]; then
                echo "$stack: $status ($(( n * step / 60 )) min)" >&2
                last=$status
              fi
              if [ "$n" -ge "$cap" ]; then echo "$status"; return 0; fi
              sleep "$CFN_POLL_SLEEP"; n=$((n + 1))
            done
          }

          cfn_after_failure() {
            local status
            cfn_events "$1" "$2"
            status=$(cfn_wait "$1" "$2") || status=UNKNOWN
            echo "$1 ended in $status."
            if [ "$status" = UPDATE_ROLLBACK_FAILED ]; then cfn_stuck_hint "$1" "$2" "$3"; fi
          }

          # cfn_deploy STACK REGION TEMPLATE EXEC_ROLE RECREATE_IF_FAILED_FIRST_CREATE(yes|no) [aws deploy arguments...]
          cfn_deploy() {
            local stack=$1 region=$2 template=$3 role=$4 recreate=$5 status kind cs log expected
            shift 5
            status=$(cfn_status "$stack" "$region") || return 1
            case "$status" in
              ACCESS_DENIED) cfn_need_setup ;;
              ROLLBACK_COMPLETE)
                if [ "$recreate" != yes ]; then
                  echo "::error::$stack is in ROLLBACK_COMPLETE after a failed first deployment. It holds data that must not be removed automatically: look at its events in the CloudFormation console, then remove it by hand and re-run."
                  return 1
                fi
                echo "Removing the failed first deployment of $stack..."
                aws cloudformation delete-stack --region "$region" --stack-name "$stack" --role-arn "$role"
                status=$(cfn_wait "$stack" "$region") || return 1
                if [ "$status" != NONE ]; then
                  cfn_events "$stack" "$region"
                  echo "::error::Could not remove the failed first deployment of $stack (it is in $status). Look at its events in the CloudFormation console ($region), remove it by hand and re-run."
                  return 1
                fi ;;
              UPDATE_ROLLBACK_FAILED) cfn_stuck_hint "$stack" "$region" "$role"; return 1 ;;
              REVIEW_IN_PROGRESS) ;;
              *_IN_PROGRESS) echo "::error::$stack is busy ($status). Wait for it to finish, then re-run."; return 1 ;;
            esac
            kind=update
            if [ "$status" = NONE ] || [ "$status" = REVIEW_IN_PROGRESS ]; then kind=create; fi

            log=$(mktemp)
            if ! aws cloudformation deploy --region "$region" --stack-name "$stack" --template-file "$template" \
              --role-arn "$role" --capabilities CAPABILITY_IAM --tags application=4c-cmms \
              --no-fail-on-empty-changeset --no-execute-changeset "$@" >"$log" 2>&1; then
              cat "$log"
              if grep -qiE 'AccessDenied|not authorized' "$log"; then cfn_need_setup; fi
              return 1
            fi

            # The deploy role may not list change sets, so take the change set's ARN from what deploy printed.
            cs=$(grep -oE 'arn:[a-z-]+:cloudformation:[^ ]+:changeSet/[^ ]+' "$log" | tail -n 1 || true)
            if [ -z "$cs" ]; then
              if grep -q 'No changes to deploy' "$log"; then
                echo "$stack: no changes."
                return 0
              fi
              echo "::error::Could not find the change set of $stack in the deploy output, so nothing was applied. The output was:"
              cat "$log"
              return 1
            fi

            echo "Changes to $stack ($region):"
            # shellcheck disable=SC2016 # the backticks are a JMESPath literal, not a shell expansion
            aws cloudformation describe-change-set --region "$region" --stack-name "$stack" --change-set-name "$cs" \
              --query 'Changes[].ResourceChange.[Action,LogicalResourceId,ResourceType,Replacement||`"-"`]' --output table
            replaced=$(aws cloudformation describe-change-set --region "$region" --stack-name "$stack" --change-set-name "$cs" \
              --query "Changes[?ResourceChange.Replacement=='True' || ResourceChange.Replacement=='Conditional'].ResourceChange.LogicalResourceId" \
              --output text | tr '\t' ' ')
            if [ -n "$replaced" ]; then
              echo "::warning::$stack: these resources will be replaced (or may be): $replaced. Applying anyway."
            fi
            aws cloudformation execute-change-set --region "$region" --stack-name "$stack" --change-set-name "$cs"
            # Ends like the CLI's stack-create-complete / stack-update-complete waiter: only CREATE_COMPLETE or UPDATE_COMPLETE
            # is success; any failed, rolled-back or deleted status (or a stack that can't be read) is a failure.
            expected=UPDATE_COMPLETE
            if [ "$kind" = create ]; then expected=CREATE_COMPLETE; fi
            status=$(cfn_wait "$stack" "$region") || status=UNKNOWN
            if [ "$status" = "$expected" ]; then
              echo "$stack: done."
              return 0
            fi
            case "$status" in
              *_IN_PROGRESS)
                echo "::error::$stack is still $status after $CFN_WAIT_MINUTES minutes. CloudFormation carries on by itself: watch the stack's events in the console ($region) and re-run this workflow once it has finished."
                return 1 ;;
            esac
            cfn_after_failure "$stack" "$region" "$role"
            return 1
          }
          LIB

      - name: Read the setup stacks (cmms-github here, cmms-dr in Ireland)
        id: boot
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cfn.sh"
          status=$(cfn_status "$BOOTSTRAP_STACK" "$AWS_REGION")
          if [ "$status" = ACCESS_DENIED ] || [ "$status" = NONE ]; then cfn_need_setup; fi
          exec_role=$(cfn_output "$BOOTSTRAP_STACK" "$AWS_REGION" CloudFormationExecutionRoleArn)
          boundary=$(cfn_output "$BOOTSTRAP_STACK" "$AWS_REGION" BoundaryPolicyArn)
          bucket=$(cfn_output "$BOOTSTRAP_STACK" "$AWS_REGION" TemplateBucketName)
          if [ -z "$exec_role" ] || [ -z "$boundary" ] || [ -z "$bucket" ]; then cfn_need_setup; fi
          # The recovery stack belongs to setup.sh: the pipeline may not deploy or change it, only read its outputs.
          vault=$(cfn_output "$DR_STACK" "$DR_REGION" DrVaultArn)
          key=$(cfn_output "$DR_STACK" "$DR_REGION" DrKeyArn)
          files_copy=$(cfn_output "$DR_STACK" "$DR_REGION" FilesCopyBucketArn)
          backups_copy=$(cfn_output "$DR_STACK" "$DR_REGION" BackupsCopyBucketArn)
          if [ -z "$vault" ] || [ -z "$key" ] || [ -z "$files_copy" ] || [ -z "$backups_copy" ]; then cfn_need_setup; fi
          # A change to infra/aws/dr.yml only reaches AWS when setup.sh is run again; say so (the deploy goes on). Compared
          # without trailing spaces and trailing empty lines, which the CLI's text output may add.
          norm() { awk '{ sub(/[ \t\r]+$/, ""); line[NR] = $0 } END { n = NR; while (n > 0 && line[n] == "") n--; for (i = 1; i <= n; i++) print line[i] }' "$1"; }
          deployed=$(mktemp)
          if aws cloudformation get-template --region "$DR_REGION" --stack-name "$DR_STACK" --query TemplateBody --output text >"$deployed" 2>/dev/null; then
            if ! cmp -s <(norm "$deployed") <(norm infra/aws/dr.yml); then
              echo "::warning::infra/aws/dr.yml differs from the deployed recovery stack $DR_STACK. The workflow never deploys it: re-run deploy/aws/setup.sh in CloudShell to apply the change."
            fi
          else
            echo "::notice::Could not read the template of $DR_STACK to compare it with infra/aws/dr.yml."
          fi
          {
            echo "exec_role=$exec_role"
            echo "boundary=$boundary"
            echo "bucket=$bucket"
            echo "vault=$vault"
            echo "key=$key"
            echo "files_copy=$files_copy"
            echo "backups_copy=$backups_copy"
          } >> "$GITHUB_OUTPUT"

      - name: Sign in to the image registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.ecr.outputs.registry }}/cmms:${{ env.COMMIT }}
          build-args: VERSION=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image (stops on a critical flaw that has a fix)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/cmms:${{ env.COMMIT }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.2 \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"

      - name: Push the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/cmms:${{ env.COMMIT }}
        run: docker push "$IMAGE"

      - name: Deploy the edge stack (cmms-edge, N. Virginia)
        env:
          EXEC_ROLE: ${{ steps.boot.outputs.exec_role }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cfn.sh"
          # The app stack's distribution id, for the edge stack's error alarm. Empty (the alarm is skipped) on a first-ever
          # deploy, and until the app stack has been deployed once with the DistributionId output (0.29.1 adds it).
          # An app stack that exists but cannot be read right now (a failed call) must not remove the alarm: the edge stack's
          # current value stays (the deploy role already describes both stacks).
          dist_id=""
          app_status=$(cfn_status "$STACK" "$AWS_REGION") || app_status=UNREADABLE
          if [ "$app_status" = NONE ]; then
            echo "The application stack does not exist yet: the CloudFront error alarm is skipped this time."
          elif dist_id=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue | [0]" --output text 2>/dev/null); then
            if [ "$dist_id" = None ] || [ "$dist_id" = null ]; then dist_id=""; fi
            if [ -z "$dist_id" ]; then echo "No distribution id yet: the CloudFront error alarm is skipped this time."; fi
          else
            dist_id=$(aws cloudformation describe-stacks --region "$EDGE_REGION" --stack-name "$EDGE_STACK" \
              --query "Stacks[0].Parameters[?ParameterKey=='DistributionId'].ParameterValue | [0]" --output text 2>/dev/null || true)
            if [ "$dist_id" = None ] || [ "$dist_id" = null ]; then dist_id=""; fi
            echo "::warning::Could not read the application stack's outputs: the CloudFront error alarm keeps the distribution it has (${dist_id:-none})."
          fi
          cfn_deploy "$EDGE_STACK" "$EDGE_REGION" infra/aws/edge.yml "$EXEC_ROLE" yes \
            --parameter-overrides \
              WafMode="$WAF_MODE" \
              AlertEmail="$ALERT_EMAIL" \
              CreateGuardDutyDetector="$CREATE_GUARDDUTY_US_EAST" \
              DistributionId="$dist_id"

      - name: Read the edge stack's outputs
        id: outputs
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cfn.sh"
          web_acl=$(cfn_output "$EDGE_STACK" "$EDGE_REGION" WebAclArn)
          if [ -z "$web_acl" ]; then echo "::error::The edge stack $EDGE_STACK has no WebAclArn output."; exit 1; fi
          echo "web_acl=$web_acl" >> "$GITHUB_OUTPUT"

      # Fresh credentials for the longest step: the app's stack can take hours (the wait below allows 3), longer than the first
      # sign-in's 2 hours. 4 hours needs the setup of 0.29.0 (the deploy role's MaxSessionDuration); a run against an older
      # setup has already stopped at "Re-run deploy/aws/setup.sh" above.
      - name: Sign in to AWS again (for the application stack)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 14400
          unset-current-credentials: true

      - name: Deploy the application (the first run takes about 30 minutes, mostly creating the database)
        id: deploy
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/cmms:${{ env.COMMIT }}
          EXEC_ROLE: ${{ steps.boot.outputs.exec_role }}
          BOUNDARY_ARN: ${{ steps.boot.outputs.boundary }}
          TEMPLATE_BUCKET: ${{ steps.boot.outputs.bucket }}
          WEB_ACL_ARN: ${{ steps.outputs.outputs.web_acl }}
          DR_VAULT_ARN: ${{ steps.boot.outputs.vault }}
          DR_KEY_ARN: ${{ steps.boot.outputs.key }}
          FILES_COPY_ARN: ${{ steps.boot.outputs.files_copy }}
          BACKUPS_COPY_ARN: ${{ steps.boot.outputs.backups_copy }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cfn.sh"
          prefix_list=$(aws ec2 describe-managed-prefix-lists \
            --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
            --query 'PrefixLists[0].PrefixListId' --output text)
          if [[ ! "$prefix_list" =~ ^pl- ]]; then echo "::error::CloudFront prefix list not found in $AWS_REGION"; exit 1; fi

          # The template is too big to send inline, so it goes through the bootstrap's template bucket.
          # A first deployment that failed and rolled back cannot be updated; it is removed and started again.
          cfn_deploy "$STACK" "$AWS_REGION" infra/aws/cmms.yml "$EXEC_ROLE" yes \
            --s3-bucket "$TEMPLATE_BUCKET" \
            --parameter-overrides \
              ImageUri="$IMAGE" \
              OriginPrefixListId="$prefix_list" \
              AllowRegistration="$ALLOW_REGISTRATION" \
              DbInstanceClass="$DB_INSTANCE_CLASS" \
              MailDomain="$MAIL_DOMAIN" \
              MailFromAddress="$MAIL_FROM_ADDRESS" \
              MailAllowedOrganizations="$MAIL_ALLOWED_ORGS" \
              Domain="$DOMAIN" \
              DomainCertificateArn="$DOMAIN_CERTIFICATE_ARN" \
              PushSecretArn="$PUSH_SECRET_ARN" \
              AnthropicSecretArn="$ANTHROPIC_SECRET_ARN" \
              BoundaryPolicyArn="$BOUNDARY_ARN" \
              WebAclArn="$WEB_ACL_ARN" \
              DrVaultArn="$DR_VAULT_ARN" \
              DrKeyArn="$DR_KEY_ARN" \
              FilesCopyBucketArn="$FILES_COPY_ARN" \
              BackupsCopyBucketArn="$BACKUPS_COPY_ARN" \
              RequireEmailConfirmation="$REQUIRE_EMAIL_CONFIRMATION" \
              DbMajorEngineVersion="$DB_MAJOR_ENGINE_VERSION" \
              IrelandDatabaseCopy="$IRELAND_DB_COPY" \
              AlertEmail="$ALERT_EMAIL" \
              CreateGuardDutyDetector="$CREATE_GUARDDUTY_LONDON"

          url=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          cloudfront=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomain'].OutputValue" --output text)
          echo "cloudfront=$cloudfront" >> "$GITHUB_OUTPUT"

      - name: Wait for the new version to answer
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for _ in $(seq 1 60); do
            version=$(curl -fsS --max-time 10 "$URL/api/health" | jq -r .version 2>/dev/null || true)
            if [ "$version" = "$COMMIT" ]; then echo "Live at $URL (version $version)"; exit 0; fi
            sleep 15
          done
          echo "::error::$URL did not report version $COMMIT within 15 minutes. Check the logs in CloudWatch: log group /ecs/$STACK."
          exit 1

      - name: Summary
        if: always() && steps.deploy.outputs.url != ''
        run: |
          {
            echo "### CMX on AWS"
            echo ""
            echo "**${{ steps.deploy.outputs.url }}**"
            echo ""
            echo "Version \`$(cat VERSION 2>/dev/null || echo unknown)\` · commit \`$COMMIT\` · region \`$AWS_REGION\` · stack \`$STACK\` · database \`$DB_INSTANCE_CLASS\` · sign-up open: \`$ALLOW_REGISTRATION\`"
            echo ""
            echo "CloudFront address: \`${{ steps.deploy.outputs.cloudfront }}\`${DOMAIN:+ (own address: \`$DOMAIN\`)} · e-mail: ${MAIL_FROM_ADDRESS:-off}"
            echo ""
            echo "Web firewall: \`$WAF_MODE\` · e-mail confirmation on sign-up: \`$REQUIRE_EMAIL_CONFIRMATION\` · alarm address: \`$([ -n "$ALERT_EMAIL" ] && echo set || echo not set)\`"
            if [ "$WAF_MODE" = count ]; then
              echo ""
              echo "The web firewall is only counting. After a day or two with no real users caught, set CMMS_WAF_MODE to block and re-run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  recover:
    name: Continue a stuck rollback
    # Recovery only: runs when a stack is chosen on the Run workflow form. It deploys nothing.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && github.event_name == 'workflow_dispatch' &&
      inputs.continue_rollback_stack != '' && inputs.continue_rollback_stack != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_TO_FIX: ${{ inputs.continue_rollback_stack }}
      SKIP_IDS: ${{ inputs.resources_to_skip }}
    steps:
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Continue the rollback
        run: |
          set -euo pipefail
          case "$STACK_TO_FIX" in
            cmms-app) region="$AWS_REGION" ;;
            cmms-edge) region=us-east-1 ;;
            # cmms-dr is not here: it belongs to setup.sh, and the pipeline may not touch it (a console administrator does).
            *) echo "::error::Unknown stack $STACK_TO_FIX"; exit 1 ;;
          esac
          if [[ ! "$SKIP_IDS" =~ ^[A-Za-z0-9,\ ]*$ ]]; then
            echo "::error::resources_to_skip may only hold logical resource ids separated by commas."
            exit 1
          fi
          account=$(aws sts get-caller-identity --query Account --output text)
          cfn_role="arn:aws:iam::${account}:role/cmms-cfn-exec-${AWS_REGION}"
          status=$(aws cloudformation describe-stacks --region "$region" --stack-name "$STACK_TO_FIX" --query 'Stacks[0].StackStatus' --output text)
          if [ "$status" != UPDATE_ROLLBACK_FAILED ]; then
            echo "::error::$STACK_TO_FIX is in $status, not UPDATE_ROLLBACK_FAILED. Nothing to continue."
            exit 1
          fi
          read -r -a skip <<< "${SKIP_IDS//,/ }"
          args=()
          if [ "${#skip[@]}" -gt 0 ]; then args=(--resources-to-skip "${skip[@]}"); fi
          aws cloudformation continue-update-rollback --region "$region" --stack-name "$STACK_TO_FIX" --role-arn "$cfn_role" "${args[@]}"
          if aws cloudformation wait stack-rollback-complete --region "$region" --stack-name "$STACK_TO_FIX"; then
            echo "$STACK_TO_FIX rolled back. Re-run Deploy to AWS (with continue_rollback_stack on none) to deploy again."
          else
            aws cloudformation describe-stack-events --region "$region" --stack-name "$STACK_TO_FIX" --max-items 40 \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp, LogicalResourceId, ResourceStatusReason]" --output table || true
            echo "::error::$STACK_TO_FIX is still not rolled back. Add the failed resources above to resources_to_skip and run again."
            exit 1
          fi

  tag:
    name: Tag the release
    # The release tag is made here, after the deploy, because GitHub Desktop does not push tags made on the command
    # line. Only for main: a manual deploy of another branch is not a release.
    needs: deploy
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Tag vX.Y.Z (from VERSION) on the deployed commit
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/tag-release.sh "$COMMIT"
