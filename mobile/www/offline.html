<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>4C CMMS</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Roboto, sans-serif;
           background: #f1f6fd; color: #1a1b1e; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #1a1b1e; color: #e9ecef; } .card { background: #25262b; } }
    .card { max-width: 360px; width: 100%; background: #fff; border-radius: 12px; padding: 28px 24px; text-align: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
    .logo { width: 48px; height: 48px; border-radius: 12px; background: #1c7ed6; margin: 0 auto 16px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; margin: 0 0 20px; opacity: .75; }
    button { background: #1c7ed6; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true"></div>
    <h1>Can't reach 4C CMMS</h1>
    <p>Check your connection, then try again.</p>
    <!-- Same address as server.url in capacitor.config.ts. -->
    <button type="button" onclick="location.replace('https://cmx.cworks.com.eg/tech/')">Try again</button>
  </div>
</body>
</html>
